name: Sync production prompts to Langfuse

on:
    push:
        branches:
            # - master
            - cg_dev
        paths:
        - 'soda_mmqc/data/production_prompts/**/*.txt'
        - 'soda_mmqc/data/production_prompts/**/*.json'
    workflow_dispatch:

concurrency:
    group: sync-prompts-langfuse
    cancel-in-progress: true

jobs:
    sync-prompts:
        runs-on: ubuntu-latest

        env:
            LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
            LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Validate required secrets
              run: |
                test -n "$LANGFUSE_BASE_URL" || (echo "Missing LANGFUSE_BASE_URL" && exit 1)
                test -n "$LANGFUSE_PUBLIC_KEY" || (echo "Missing LANGFUSE_PUBLIC_KEY" && exit 1)
                test -n "$LANGFUSE_SECRET_KEY" || (echo "Missing LANGFUSE_SECRET_KEY" && exit 1)

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install dependencies
              run: |
                pip install "langfuse>=2.0.0"

            - name: Find changed production prompt files
              id: changed
              shell: bash
              run: |
                if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                  echo "files=ALL" >> "$GITHUB_OUTPUT"
                  exit 0
                fi

                BEFORE="${{ github.event.before }}"
                AFTER="${{ github.sha }}"

                PATHS=(
                  'soda_mmqc/data/production_prompts'
                )

                if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                  FILES=$(git ls-files "${PATHS[@]}" | grep -E '\.(txt|json)$')
                else
                  FILES=$(git diff --name-only "$BEFORE" "$AFTER" -- "${PATHS[@]}" | grep -E '\.(txt|json)$')
                fi

                FILES=$(echo "$FILES" | sed '/^$/d' | paste -sd "," -)

                if [ -z "$FILES" ]; then
                  echo "files=" >> "$GITHUB_OUTPUT"
                else
                  echo "files=$FILES" >> "$GITHUB_OUTPUT"
                fi

            - name: Stop if nothing relevant changed
              if: github.event_name != 'workflow_dispatch' && steps.changed.outputs.files == ''
              run: |
                echo "No .txt or .json changes detected under production prompts directories"
                exit 0

            - name: Symlink production prompts into temporary checklist root
              id: link_prompts
              shell: bash
              run: |
                TMP_CHECKLIST_ROOT="$RUNNER_TEMP/checklist-root"
                TMP_FIG_ROOT="$TMP_CHECKLIST_ROOT/fig-checklist"
                SRC_ROOT="$GITHUB_WORKSPACE/soda_mmqc/data/production_prompts"

                mkdir -p "$TMP_FIG_ROOT"

                for check_dir in "$SRC_ROOT"/*; do
                  [ -d "$check_dir" ] || continue
                  check_name="$(basename "$check_dir")"
                  ln -sfn "$check_dir" "$TMP_FIG_ROOT/$check_name"
                done

                CHANGED="${{ steps.changed.outputs.files }}"
                if [ "$CHANGED" = "ALL" ]; then
                  echo "mapped_files=ALL" >> "$GITHUB_OUTPUT"
                else
                  MAPPED_FILES=""
                  IFS=',' read -ra RAW_FILES <<< "$CHANGED"
                  for file in "${RAW_FILES[@]}"; do
                    rel="${file#soda_mmqc/data/production_prompts/}"
                    mapped="$TMP_FIG_ROOT/$rel"
                    if [ -z "$MAPPED_FILES" ]; then
                      MAPPED_FILES="$mapped"
                    else
                      MAPPED_FILES="$MAPPED_FILES,$mapped"
                    fi
                  done
                  echo "mapped_files=$MAPPED_FILES" >> "$GITHUB_OUTPUT"
                fi

                echo "CHECKLIST_ROOT=$TMP_CHECKLIST_ROOT" >> "$GITHUB_ENV"
                echo "WATCHED_CHECKLISTS=fig-checklist" >> "$GITHUB_ENV"

            - name: Sync production prompts to Langfuse
              run: |
                python .github/scripts/sync_langfuse_checklist.py "${{ steps.link_prompts.outputs.mapped_files }}"